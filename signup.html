<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up | Kairos</title>
    <link rel="stylesheet" href="landing.css">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180.png">
    <style>
        .login-page { display:flex; min-height:100vh; width:100%; }
        .login-container { flex:2; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:40px; background:#0f0f13; }
        .login-box { width:100%; max-width:400px; box-sizing:border-box; }
        .login-logo { display:flex; align-items:center; gap:8px; margin-bottom:24px; }
        .login-logo img { height:32px; width:auto; }
        .login-logo span { font-size:1.3rem; font-weight:bold; color:#a855f7; letter-spacing:1px; }
        .login-box h2 { font-size:2rem; margin-bottom:10px; }
        .login-box p { color:#aaa; margin-bottom:30px; }
        .social-btn { width:100%; padding:12px; margin-bottom:15px; border-radius:6px; border:1px solid #333; background:#1e1e2f; color:#fff; font-weight:bold; cursor:pointer; transition:.3s; display:flex; align-items:center; justify-content:center; gap:10px; box-sizing:border-box; }
        .social-btn:hover { background:#2a2a40; border-color:#a855f7; }
        .social-btn img { width:18px; height:18px; object-fit:contain; flex-shrink:0; }
        .divider { text-align:center; margin:20px 0; color:#666; font-size:.9rem; }
        .form-group { margin-bottom:15px; }
        .form-group label { display:block; margin-bottom:5px; color:#ccc; font-size:.9rem; }
        .form-group input { width:100%; padding:12px; border-radius:6px; background:#1e1e2f; border:1px solid #333; color:#fff; box-sizing:border-box; }
        .login-btn { width:100%; padding:12px; border-radius:6px; background:#a855f7; border:none; color:white; font-weight:bold; cursor:pointer; margin-top:10px; box-sizing:border-box; }
        .login-btn:disabled { opacity:.65; cursor:not-allowed; }
        .auth-switch { margin-top:18px; text-align:center; color:#888; font-size:.9rem; }
        .auth-switch a { color:#a855f7; font-weight:600; text-decoration:none; }
        .auth-switch a:hover { text-decoration:underline; }
        .signup-security-note {
            margin: 14px 0 0;
            padding: 10px 12px;
            border: 1px solid #2b2b3a;
            border-radius: 8px;
            background: #15151d;
            color: #858592;
            font-size: .78rem;
            line-height: 1.45;
        }
        .signup-honeypot {
            position: absolute !important;
            left: -10000px !important;
            width: 1px !important;
            height: 1px !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
        .image-container { flex:3; background:url('image_0c9bc9.png') center/cover no-repeat; border-left:1px solid #333; }
        @media (max-width:768px) {
            .login-page { flex-direction:column; }
            .image-container { display:none; }
            .login-container { flex:1; min-height:100vh; padding:32px 20px; justify-content:flex-start; overflow-y:auto; }
            .login-box { max-width:440px; margin:auto 0; }
            .login-logo { margin-bottom:20px; }
            .login-box h2 { font-size:1.75rem; }
            .login-box p { margin-bottom:24px; }
            .social-btn { padding:13px 12px; }
        }
        @media (max-width:380px) {
            .login-container { padding:24px 16px; }
            .login-logo img { height:28px; }
            .login-logo span { font-size:1.2rem; }
            .login-box h2 { font-size:1.55rem; }
        }
    </style>
</head>
<body>
<div class="login-page">
<div class="login-container">
<div class="login-box">
    <div class="login-logo"><img src="images/kairos-logo.png" alt="Kairos"><span>Kairos</span></div>
    <h2>Create your account</h2>
    <p>Create your Kairos account and start planning smarter.</p>

    <div class="social-buttons">
        <button class="social-btn" id="btn-google"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">Continue with Google</button>
        <button class="social-btn" id="btn-github"><img src="https://github.githubassets.com/assets/GitHub-Mark-ea2971cee799.png" alt="">Continue with GitHub</button>
        <button class="social-btn" id="btn-microsoft"><img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" alt="">Continue with Microsoft</button>
    </div>

    <div class="divider">OR SIGN UP WITH EMAIL</div>

    <form id="signup-form" novalidate>
        <!-- Honeypot field: real users never see or fill this. -->
        <div class="signup-honeypot" aria-hidden="true">
            <label for="website">Website</label>
            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="••••••••" autocomplete="new-password" minlength="6">
        </div>
        <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" required placeholder="••••••••" autocomplete="new-password" minlength="6">
        </div>
        <button type="submit" class="login-btn" id="signup-submit">Create account</button>
    </form>

    <p class="signup-security-note">Kairos uses automated abuse protection and may require additional security verification for suspicious sign-up activity.</p>
    <div class="auth-switch">Already have an account? <a href="login.html">Log in</a></div>
</div>
</div>
<div class="image-container"></div>
</div>
<script type="module" src="signup.js"></script>
</body>
</html>
