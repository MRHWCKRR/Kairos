name: Schedule build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  schedule-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Verify routed page loading
        run: node --test tests/page-loading.test.mjs tests/page-router.test.mjs tests/page-render-cache.test.mjs
      - name: Run Cloudflare tests and build
        run: npm run build:cloudflare
      - name: Verify Cloudflare runtime and bundle
        run: |
          npm run test:runtime
          npx wrangler deploy --dry-run --env preview
      - name: Run Schedule tests and build
        run: npm run build
